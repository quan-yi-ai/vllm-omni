# MiniCPM-o 4.5 three-stage deploy on one large-memory GPU.
npu_perf_defaults: false
pipeline: minicpmo_4_5
async_chunk: true

trust_remote_code: true
enable_prefix_caching: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      # 25 codec frames ≈ 1.04 s audio per stage2 chunk. 50 halves the
      # per-request stage2 kernel-launch count (launch-bound on 910B2,
      # cf. #5069) at the cost of ~1 s extra first-chunk latency for
      # non-streaming /v1/audio/speech.
      codec_chunk_frames: 50
      # Fast first audio: fire the first stage2 chunk at 25 frames (~1.04 s)
      # instead of waiting for a full 50-frame chunk, cutting TTFB by roughly
      # one chunk of Talker sampling; steady-state chunks stay at 50.
      # Fast first audio: fire the first stage2 chunk at 15 frames (~0.62 s)
      # instead of a full 50-frame chunk. Measured on 910B2: first-chunk
      # latency 1.56s -> 1.00s (mid) / 1.84s -> 1.24s (long); steady-state
      # RTF 0.549. icf=4 (910C param, f9d92072) retested 2026-08-29 with
      # NPUGraph on: RTF 0.5366 vs 0.5174 -> regression; 10 frames was 0.577.
      # 15 remains the 910B2 sweet spot even with stage2 graphed.
      initial_codec_chunk_frames: 15
      codec_left_context_frames: 3
      # Code2Wav (stage 2) tuning knobs, read by MiniCPMO45Code2Wav via the
      # stage-connector ``extra`` mapping (cf. vllm-omni#6465 / #6386):
      # CFM DiT ODE solver steps. Upstream default is 10; 3 gives ~3x fewer
      # estimator evals per mel chunk (matches the Ascend A3 qualification
      # profile) with no audible degradation on 910B2.
      token2wav_n_timesteps: 3
      # Trajectory jump (cf. BatchedToken2Wav._decode_cfm): stop the CFM loop
      # after 2 of 3 estimator forwards and extrapolate to t=1. 910C-measured
      # RTF 0.3943 -> 0.37; stage2 is kernel-launch-bound on 910B2 so this
      # directly cuts per-chunk launch count.
      token2wav_jump_steps: 2
      # Mixed-precision autocast for Code2Wav flow+HiFT. NOTE: measured
      # neutral on 910B2 at current chunk sizes (RTF 0.576 vs 0.572 fp32;
      # stage2 is launch-bound, autocast only adds cast overhead), so left
      # OFF by default. BatchedToken2Wav._autocast keeps "npu" routing for
      # future large-batch scenarios (cf. #5069).
      token2wav_float16: false

stages:
  - stage_id: 0
    # Four-way concurrency matches the single-GPU memory shares below;
    # larger batches make Code2Wav activations OOM on one H100.
    max_num_seqs: 4
    # Leave headroom on the shared GPU for Talker KV + concurrent Code2Wav.
    gpu_memory_utilization: 0.55
    enforce_eager: false
    tensor_parallel_size: 1
    max_num_batched_tokens: 16384
    max_model_len: 32768
    devices: "0"
    # Required for MiniCPM interleaved image/audio Daily-Omni packs (~78% recipe).
    # Keep these in YAML so they survive both --deploy-config and --stage-configs-path.
    interleave_mm_strings: true
    media_io_kwargs:
      video:
        fps: 1
        num_frames: 128
    limit_mm_per_prompt:
      # Daily-Omni: up to 64 interleaved image/audio pairs (1fps).
      # Video-MME minicpm-frames: OmniEvalKit samples up to 96 frames as image_url.
      image: 96
      audio: 64
      video: 1
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      # 1.0 for MCQ accuracy; 1.1 can bias short A–D answers.
      repetition_penalty: 1.0

  - stage_id: 1
    max_num_seqs: 4
    gpu_memory_utilization: 0.15
    enforce_eager: false
    max_num_batched_tokens: 8192
    # Talker context is 4096 (tts_config.max_position_embeddings).
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_2: connector_of_shared_memory
    # Codec sampling comes from the checkpoint's tts_config. These parameters
    # govern only vLLM's binary continue/stop token.
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      min_tokens: 50
      max_tokens: 2048
      stop_token_ids: [1]
      seed: 42
      detokenize: false

  - stage_id: 2
    max_num_seqs: 4
    gpu_memory_utilization: 0.18
    enforce_eager: true
    enable_chunked_prefill: false
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      detokenize: true

platforms:
  npu:
    stages:
      - stage_id: 0
        max_num_batched_tokens: 8192
        compilation_config:
          cudagraph_mode: PIECEWISE
      - stage_id: 1
        max_num_batched_tokens: 8192
        compilation_config:
          cudagraph_mode: PIECEWISE
      - stage_id: 2
        # Stage 2 stays outer-eager and captures only exact-shape CFM DiT
        # estimator kernels through the NPU platform patch.
        additional_config:
          code2wav_enable_npu_graph: true
          code2wav_max_npu_graphs: 32
