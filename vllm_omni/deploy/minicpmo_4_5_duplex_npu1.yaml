# MiniCPM-o 4.5 native duplex deployment on NPU1 (device '1').
# Overlay of minicpmo_4_5.yaml with session duplexing + all stages on NPU1.
# NOTE: PIECEWISE stage1 crashes with v4 sched_k=8 (assert num_tokens_scheduled>0
# on W4 prewarm). FULL_DECODE_ONLY keeps prewarm+serve up; duplex requests hit
# upstream #6143 (official NPU bug, listen-only) - half-duplex is the demo focus.
base_config: minicpmo_4_5.yaml
pipeline: minicpmo_4_5
session_mode: duplex
active_stream_window: 1
duplex_session:
  idle_ttl_s: 300
  disconnect_grace_s: 30
  reaper_interval_s: 5
  resume_replay_ttl_s: 60
  resume_replay_max_bytes_per_session: 8388608
  max_pending_input_bytes_per_session: 16777216
  max_pending_turns_per_session: 4
  max_sessions: 2
  completed_append_cache_size: 256

stages:
  - stage_id: 0
    max_num_seqs: 2
    async_scheduling: false
    devices: '1'

  - stage_id: 1
    max_num_seqs: 2
    async_scheduling: false
    devices: '1'
    max_model_len: 4096
    default_sampling_params:
      max_tokens: 2048
      min_tokens: 0
      stop_token_ids: [1]

  - stage_id: 2
    max_num_seqs: 2
    async_scheduling: false
    devices: '1'
