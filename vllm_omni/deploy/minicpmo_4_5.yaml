pipeline: minicpmo_4_5
async_chunk: true
trust_remote_code: true
enable_prefix_caching: false
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      # 910B2-tuned (Seed-TTS zh, RTF 0.5238 final): 50 halves the stage2
      # launch count vs stock 25 (stage2 is kernel-launch-bound on 910B2,
      # cf. #5069); first chunk fires early at 15 frames instead of waiting
      # a full 50-frame chunk (first-chunk latency 1.56s -> 1.00s).
      codec_chunk_frames: 50
      initial_codec_chunk_frames: 15
      # CFM DiT ODE steps: 3 (910B2/910C both measured; the TJS env
      # OMNI_TJS_STOP=1 in BatchedToken2Wav then makes it a pseudo-1-step
      # solve). Kept explicit for auditability alongside the 910B2 numbers.
      token2wav_n_timesteps: 3
      codec_left_context_frames: 3
stages:
- stage_id: 0
  # 4-way concurrency matches the 910B2 (64GB) memory shares below; 8 (the
  # 910C Atlas A3 value) makes Code2Wav activations OOM on 910B2.
  max_num_seqs: 4
  gpu_memory_utilization: 0.55
  enforce_eager: false
  tensor_parallel_size: 1
  max_num_batched_tokens: 16384
  max_model_len: 32768
  devices: '0'
  interleave_mm_strings: true
  media_io_kwargs:
    video:
      fps: 1
      num_frames: 128
  limit_mm_per_prompt:
    image: 96
    audio: 64
    video: 1
  default_sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    # 2048 (not the TTS-only 32): Daily-Omni video QA answers exceed 32
    # tokens; 32 hard-truncates them even with H1 early termination.
    max_tokens: 2048
    seed: 42
    detokenize: true
    repetition_penalty: 1.0
- stage_id: 1
  max_num_seqs: 4
  gpu_memory_utilization: 0.15
  enforce_eager: false
  max_num_batched_tokens: 8192
  max_model_len: 4096
  devices: '0'
  output_connectors:
    to_stage_2: connector_of_shared_memory
  default_sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    min_tokens: 50
    max_tokens: 2048
    stop_token_ids:
    - 1
    seed: 42
    detokenize: false
- stage_id: 2
  max_num_seqs: 4
  gpu_memory_utilization: 0.18
  enforce_eager: true
  enable_chunked_prefill: false
  max_num_batched_tokens: 65536
  max_model_len: 65536
  devices: '0'
  input_connectors:
    from_stage_1: connector_of_shared_memory
  default_sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    max_tokens: 65536
    detokenize: true
platforms:
  npu:
    stages:
    - stage_id: 0
      max_num_batched_tokens: 8192
      compilation_config:
        cudagraph_mode: PIECEWISE
    - stage_id: 1
      max_num_batched_tokens: 8192
      compilation_config:
        cudagraph_mode: PIECEWISE
